<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 체육 선생님 - 스마트 스쿼트</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: #f8f9fa; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        nav { background: #2c3e50; padding: 1rem; display: flex; justify-content: center; gap: 15px; z-index: 10; }
        nav button { background: none; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; cursor: pointer; border-radius: 5px; }
        nav button.active { background: #3498db; border-color: #3498db; font-weight: bold; }
        
        .content-wrapper { flex: 1; position: relative; }
        section { display: none; padding: 20px; text-align: center; height: 100%; box-sizing: border-box; }
        section.active { display: block; }

        .canvas-wrapper { position: relative; width: 640px; height: 480px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; border: 4px solid #ddd; }
        .canvas-wrapper.success { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); }
        
        .input_video { transform: rotateY(180deg); width: 100%; height: 100%; object-fit: cover; position: absolute; left: 0; top: 0; opacity: 0; } 
        .output_canvas { position: absolute; left: 0; top: 0; transform: rotateY(180deg); width: 100%; height: 100%; z-index: 2; }
        
        .status-panel { margin-top: 15px; padding: 15px; background: white; border-radius: 8px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .status-ok { color: #2ecc71; font-weight: bold; }
        .status-wait { color: #e67e22; }
        .status-fail { color: #e74c3c; font-weight: bold; }

        .feedback-text { font-size: 2rem; font-weight: bold; color: #34495e; margin: 15px 0; min-height: 2.5rem; }
        .count-badge { font-size: 4rem; color: #2c3e50; margin: 10px; font-weight: 900; }
        
        #start-practice-btn { padding: 15px 40px; font-size: 1.3rem; background: #2ecc71; color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #start-practice-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: scale(0.95); opacity: 0.7; }
        #start-practice-btn:not(:disabled):hover { background: #27ae60; transform: scale(1.05); }
    </style>
</head>
<body>
    <nav id="main-nav">
        <button id="nav-ready" class="active">1. 준비 및 인식</button>
        <button id="nav-practice">2. 스쿼트 연습</button>
        <button id="nav-test">3. 실전 시험</button>
        <button id="nav-leaderboard">4. 리더보드</button>
    </nav>

    <div class="content-wrapper">
        <section id="ready" class="active">
            <h2>👋 안녕하세요! 카메라를 허용하고 전신이 보이게 서주세요</h2>
            <div class="canvas-wrapper" id="ready-wrapper">
                <video class="input_video" autoplay playsinline muted></video>
                <canvas class="output_canvas" width="640" height="480"></canvas>
            </div>
            <div class="status-panel">
                <div class="status-item">카메라 상태: <span id="camera-status" class="status-wait">권한 확인 중...</span></div>
                <div class="status-item">인식 상태: <span id="pose-status" class="status-wait">사람을 찾는 중...</span></div>
            </div>
            <div style="margin-top: 25px;">
                <button id="start-practice-btn" onclick="showSection('practice')" disabled>인식 완료! 연습 시작하기</button>
            </div>
        </section>

        <section id="practice">
            <div class="feedback-text" id="practice-feedback">자세를 잡아주세요</div>
            <div class="canvas-wrapper">
                <video class="input_video" autoplay playsinline muted></video>
                <canvas class="output_canvas" width="640" height="480"></canvas>
            </div>
            <div style="margin-top: 20px;">
                <div class="count-badge"><span id="count-val">0</span>회</div>
                <button onclick="resetCount()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">기록 초기화</button>
            </div>
        </section>

        <section id="test"><h2>⏱️ 실전 시험 모드 (준비 중)</h2></section>
        <section id="leaderboard"><h2>🏆 리더보드 (준비 중)</h2></section>
    </div>

    <script type="module">
        let poseDetector = null;
        let activeSectionId = 'ready';
        let squatCount = 0;
        let isDown = false;
        const REQUIRED_LANDMARKS = [0, 11, 12, 15, 16, 23, 24, 27, 28];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
                document.getElementById('camera-status').innerText = "양호";
                document.getElementById('camera-status').className = "status-ok";
                document.querySelectorAll('.input_video').forEach(video => {
                    video.srcObject = stream;
                    video.onloadeddata = () => video.play();
                });
                detectionLoop();
            } catch (err) {
                document.getElementById('camera-status').innerText = "권한 거부 또는 카메라 없음";
                document.getElementById('camera-status').className = "status-fail";
            }
        }

        window.showSection = function(sectionId) {
            activeSectionId = sectionId;
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById(`nav-${sectionId}`).classList.add('active');
            const activeVideo = document.querySelector(`#${sectionId} .input_video`);
            if (activeVideo) activeVideo.play();
        };

        function onResults(results) {
            const activeSection = document.getElementById(activeSectionId);
            const canvasElement = activeSection.querySelector('.output_canvas');
            if (!canvasElement) return;
            const canvasCtx = canvasElement.getContext('2d');
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2, radius: 4});

                if (activeSectionId === 'ready') {
                    const isVisible = REQUIRED_LANDMARKS.every(i => results.poseLandmarks[i] && results.poseLandmarks[i].visibility > 0.6);
                    if (isVisible) {
                        document.getElementById('pose-status').innerText = "인식 양호!";
                        document.getElementById('pose-status').className = "status-ok";
                        document.getElementById('ready-wrapper').classList.add('success');
                        document.getElementById('start-practice-btn').disabled = false;
                    }
                }
                if (activeSectionId === 'practice') handleSquat(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        function handleSquat(landmarks) {
            const hip = landmarks[24], knee = landmarks[26], ankle = landmarks[28], shoulder = landmarks[12];
            const kneeAngle = calculateAngle(hip, knee, ankle);
            const hipAngle = calculateAngle(shoulder, hip, knee);
            const feedbackEl = document.getElementById('practice-feedback');

            if (kneeAngle < 90) {
                isDown = true;
                feedbackEl.innerText = "좋아요! 그대로 일어나세요.";
                feedbackEl.style.color = "#2ecc71";
            } else if (kneeAngle > 160 && isDown) {
                squatCount++;
                document.getElementById('count-val').innerText = squatCount;
                isDown = false;
                feedbackEl.innerText = "참 잘했습니다! 다음 개수 준비.";
                feedbackEl.style.color = "#3498db";
            } else if (!isDown) {
                feedbackEl.innerText = "더 깊게 앉으세요! (90도 이하)";
                feedbackEl.style.color = "#e74c3c";
            }
            if (hipAngle < 70) feedbackEl.innerText = "허리를 조금 더 세워볼까요?";
        }

        function calculateAngle(p1, p2, p3) {
            let angle = Math.abs((Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x)) * 180.0 / Math.PI);
            return angle > 180.0 ? 360 - angle : angle;
        }

        async function detectionLoop() {
            const activeVideo = document.querySelector(`section.active .input_video`);
            if (activeVideo && !activeVideo.paused) await poseDetector.send({image: activeVideo});
            requestAnimationFrame(detectionLoop);
        }

        poseDetector = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
        poseDetector.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6});
        poseDetector.onResults(onResults);
        window.resetCount = () => { squatCount = 0; document.getElementById('count-val').innerText = "0"; };
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
